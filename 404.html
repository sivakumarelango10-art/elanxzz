<style>
:root{
  --ink:#070605;--ink-2:#120f0b;--bone:#efe6d8;--ash:#8d8475;--amber:#ff9a1f;--ember:#c4420f;
  --line:rgba(239,230,216,.14);
  --f:"Archivo","Helvetica Neue",Arial,sans-serif;
  --step-small:clamp(.8125rem,.79rem + .1vw,.875rem);
  --step-body:clamp(1rem,.96rem + .2vw,1.125rem);
  --step-lead:clamp(1.15rem,1.05rem + .6vw,1.45rem);
  --ease-out:cubic-bezier(.16,.84,.24,1);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--ink);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ink);color:var(--bone);font-family:var(--f);font-size:var(--step-body);line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:clip}
::selection{background:var(--amber);color:var(--ink)}
img{max-width:100%;height:auto}
a{color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
.wrap{width:100%;max-width:1120px;margin-inline:auto;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
.skip{position:absolute;left:16px;top:-60px;background:var(--amber);color:var(--ink);padding:8px 12px;font-weight:600;z-index:10}
.skip:focus{top:12px}

/* header */
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-block:calc(16px + env(safe-area-inset-top,0px)) 16px;border-bottom:1px solid var(--line)}
.mark{font-stretch:125%;font-weight:800;font-size:1.05rem;letter-spacing:-.01em;text-decoration:none}
.mark span{color:var(--amber)}
.top nav{display:flex;flex-wrap:wrap;gap:6px 22px;justify-content:flex-end}
.top nav a{font-size:.9375rem;font-weight:500;color:var(--ash);text-decoration:none;padding-block:6px;transition:color .3s}
.top nav a:hover,.top nav a[aria-current]{color:var(--bone)}
.top nav a[aria-current]{box-shadow:inset 0 -1px var(--amber)}

/* type */
h1,h2{font-stretch:125%;font-weight:800;text-transform:uppercase;letter-spacing:-.02em;line-height:.95;margin:0;text-wrap:balance}
h1{font-size:clamp(2.6rem,1rem + 8vw,6.4rem)}
h2{font-size:clamp(1.35rem,.9rem + 2vw,2.2rem)}
h3{font-size:1.05rem;margin:0 0 4px}
p{margin:0}
.eyebrow{font-size:var(--step-small);color:var(--amber);font-weight:500;letter-spacing:.02em}
.aka{margin-top:14px;font-size:var(--step-lead);color:var(--bone)}
.aka b{color:var(--amber);font-weight:600}
.muted{color:var(--ash)}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:clamp(24px,5vw,72px);align-items:end;padding-block:clamp(48px,9vh,110px) clamp(40px,7vh,80px)}
.portrait{margin:0;position:relative;aspect-ratio:1156/1300;background:radial-gradient(ellipse 70% 60% at 50% 65%,rgba(255,154,31,.28),transparent 70%),linear-gradient(var(--ink-2),var(--ink));border:1px solid var(--line);overflow:hidden}
.portrait img{position:absolute;inset:auto 0 0 0;width:100%;height:100%;object-fit:contain;object-position:bottom}
.portrait figcaption{position:absolute;left:12px;bottom:10px;font-size:var(--step-small);color:var(--ash)}
.facts{margin:28px 0 0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 28px;border-top:1px solid var(--line);padding-top:22px}
.facts dt{font-size:var(--step-small);color:var(--ash)}
.facts dd{margin:2px 0 0;font-weight:500}
.cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--amber);color:var(--ink);border:1px solid var(--amber);padding:.75em 1.2em;border-radius:2px;font-weight:600;font-size:.9375rem;text-decoration:none;transition:background-color .3s,color .3s,border-color .3s}
.btn:hover{background:#ffb04d}
.btn.ghost{background:none;color:var(--bone);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--amber);color:var(--amber)}

/* sections */
.sec{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:clamp(16px,4vw,64px);padding-block:clamp(40px,7vh,72px);border-top:1px solid var(--line)}
.sec-body{display:grid;gap:16px;max-width:66ch}
.sec-body a{color:var(--amber);text-underline-offset:3px}
.sinc-logo{width:96px;height:auto;border-radius:4px}
.tags{display:flex;flex-wrap:wrap;gap:8px;list-style:none;margin:0;padding:0}
.tags li{border:1px solid var(--line);padding:4px 10px;font-size:var(--step-small);color:var(--bone)}
.profiles{list-style:none;margin:0;padding:0;display:grid;gap:0;border-top:1px solid var(--line)}
.profiles li{border-bottom:1px solid var(--line)}
.profiles a{display:grid;grid-template-columns:28px minmax(0,1fr) auto;align-items:center;gap:14px;padding:14px 0;text-decoration:none;color:var(--bone)}
.profiles a:hover{color:var(--amber)}
.profiles svg,.profiles img{width:24px;height:24px;color:var(--amber)}
.profiles img{object-fit:contain}
.profiles span small{display:block;color:var(--ash);font-size:var(--step-small);overflow-wrap:anywhere}
.profiles i{font-style:normal;color:var(--ash)}
.note{border-left:2px solid var(--amber);padding:4px 0 4px 16px;color:var(--bone)}

footer.end{border-top:1px solid var(--line);padding-block:28px calc(28px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;gap:12px 24px;justify-content:space-between;font-size:var(--step-small);color:var(--ash)}
footer.end a{color:var(--bone)}

@media (max-width:760px){
  .hero{grid-template-columns:1fr;padding-top:32px}
  .portrait{max-width:360px}
  .sec{grid-template-columns:1fr}
}
@media (max-width:420px){.facts{grid-template-columns:1fr}.top nav{gap:4px 14px}}

/* 404 */
.lost{min-height:calc(100svh - 140px);display:grid;align-content:center;gap:18px;padding-block:48px}
.lost .code{font-stretch:125%;font-weight:800;font-size:clamp(5rem,3rem + 14vw,12rem);line-height:.85;color:var(--amber);letter-spacing:-.04em}
.lost ul{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-wrap:wrap;gap:10px}
.lost h1{font-size:clamp(1.6rem,1rem + 3vw,3rem)}
</style>
